services:
  go-api:
    build:
      context: ../services/go/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: ${API_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY:-}
      SUPABASE_DATABASE_URL: ${SUPABASE_POOLER_TRANSACTION_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    ports:
      - "8080:8080"

  ruby-ops:
    build:
      context: ../services/ruby/ops
    environment:
      APP_ENV: ${APP_ENV:-development}
      OPS_PORT: ${OPS_PORT:-9292}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUPABASE_DATABASE_URL: ${SUPABASE_POOLER_TRANSACTION_URL:-}
    ports:
      - "9292:9292"

  migrator:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${SUPABASE_MIGRATION_DATABASE_URL:-}
    volumes:
      - ../db:/workspace/db:ro
      - ../infra/scripts:/workspace/infra/scripts:ro
    entrypoint: ["sh", "/workspace/infra/scripts/run-migrations.sh"]

  mailpit:
    image: axllent/mailpit:v1.28
    profiles: ["ops"]
    ports:
      - "1025:1025"
      - "8025:8025"
